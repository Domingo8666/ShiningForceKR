name: Python tools

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/python-tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/python-tools.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          bash -n tools/setup_s25u_gearsystem.sh
          bash -n tools/run_s25u_autopilot.sh
          bash -n tools/run_s25u_runtime_stage.sh
          bash tools/run_s25u_autopilot.sh --help
      - run: python -m compileall -q tools tests
      - run: python -m unittest discover -s tests -v
